<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#F7F3EB; font-family:'JetBrains Mono', 'Inter', monospace;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1B1A17" flood-opacity="0.08" />
    </filter>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9622B" />
      <stop offset="100%" stop-color="#B84818" />
    </linearGradient>
    <linearGradient id="meadowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3E7D2F" />
      <stop offset="100%" stop-color="#28561E" />
    </linearGradient>
    <linearGradient id="butterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D13B" />
      <stop offset="100%" stop-color="#D8B51E" />
    </linearGradient>
    <pattern id="dotGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1B1A17" opacity="0.06" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1B1A17" opacity="0.7"/>
    </marker>
    <marker id="arrowTerracotta" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D9622B"/>
    </marker>
  </defs>

  <!-- Background grid -->
  <rect width="1200" height="680" fill="#F7F3EB" />
  <rect width="1200" height="680" fill="url(#dotGrid)" />

  <!-- Title & Telemetry Header -->
  <g transform="translate(60, 50)">
    <text x="0" y="0" font-size="12" letter-spacing="2" fill="#D9622B" font-weight="700">FIG. 01 // SYSTEM ARCHITECTURE &amp; DATA TELEMETRY</text>
    <text x="0" y="28" font-family="'Playfair Display', serif" font-size="28" font-weight="800" fill="#1B1A17">RFID Absence &amp; Task KPI Verification Pipeline</text>
    <text x="0" y="50" font-size="12" fill="#1B1A17" opacity="0.6">Automated Hardware Verification → REST API → Gate Logic (≥70% Task Completion) → KPI Matrix</text>
  </g>

  <!-- CONNECTOR PATHS -->
  <!-- Station to API -->
  <path d="M 320 250 L 420 250" fill="none" stroke="#D9622B" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowTerracotta)" />
  <text x="370" y="240" font-size="10" fill="#D9622B" text-anchor="middle" font-weight="600">HTTPS POST</text>
  <text x="370" y="265" font-size="9" fill="#1B1A17" opacity="0.6" text-anchor="middle">X-API-KEY</text>

  <!-- API to Core Logic -->
  <path d="M 680 250 L 750 250" fill="none" stroke="#1B1A17" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Core Logic to DB -->
  <path d="M 880 340 L 880 430" fill="none" stroke="#1B1A17" stroke-width="2" marker-end="url(#arrow)" />
  <text x="895" y="390" font-size="10" fill="#1B1A17" opacity="0.7">Eloquent ORM</text>

  <!-- DB to Web Portal -->
  <path d="M 760 510 L 320 510" fill="none" stroke="#3E7D2F" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)" />
  <text x="540" y="500" font-size="10" fill="#3E7D2F" font-weight="600" text-anchor="middle">LIVE ROSTER &amp; MAATWEBSITE EXCEL EXPORT</text>

  <!-- NODE 1: IoT Terminal (ESP8266 + RFID) -->
  <g transform="translate(60, 150)" filter="url(#shadow)">
    <rect width="260" height="200" rx="12" fill="#FFFFFF" stroke="#1B1A17" stroke-width="1.5" />
    <rect width="260" height="34" rx="12" fill="#1B1A17" />
    <rect x="0" y="24" width="260" height="10" fill="#1B1A17" />
    <circle cx="20" cy="17" r="4" fill="#F2D13B" />
    <text x="35" y="21" font-size="11" fill="#F7F3EB" font-weight="700" letter-spacing="1">01. HARDWARE STATION</text>
    
    <g transform="translate(18, 55)">
      <rect width="224" height="38" rx="6" fill="#F3EBDD" />
      <text x="12" y="24" font-size="12" font-weight="700" fill="#1B1A17">ESP8266 NodeMCU</text>
      <text x="150" y="24" font-size="10" fill="#D9622B" font-weight="600">WiFi / C++</text>
      
      <g transform="translate(0, 46)">
        <text x="4" y="16" font-size="11" fill="#1B1A17" font-weight="600">• MFRC522 RFID 13.56MHz</text>
        <text x="4" y="32" font-size="10" fill="#1B1A17" opacity="0.65">  Reads UID on Mifare 1K Card</text>
        <text x="4" y="50" font-size="11" fill="#1B1A17" font-weight="600">• LCD 16x2 I2C Display</text>
        <text x="4" y="66" font-size="10" fill="#1B1A17" opacity="0.65">  Shows "Tap-In OK" or "Deny &lt;70%"</text>
        <text x="4" y="84" font-size="11" fill="#1B1A17" font-weight="600">• Buzzer Alert &amp; Mode Switch</text>
      </g>
    </g>
  </g>

  <!-- NODE 2: REST API & Routing (Laravel) -->
  <g transform="translate(420, 150)" filter="url(#shadow)">
    <rect width="260" height="200" rx="12" fill="#FFFFFF" stroke="#D9622B" stroke-width="2" />
    <rect width="260" height="34" rx="12" fill="url(#terracottaGrad)" />
    <rect x="0" y="24" width="260" height="10" fill="url(#terracottaGrad)" />
    <circle cx="20" cy="17" r="4" fill="#FFFFFF" />
    <text x="35" y="21" font-size="11" fill="#FFFFFF" font-weight="700" letter-spacing="1">02. LARAVEL 10 REST API</text>
    
    <g transform="translate(18, 55)">
      <rect width="224" height="28" rx="4" fill="#FBF5F0" stroke="#D9622B" stroke-width="1" />
      <text x="10" y="18" font-size="10" font-weight="700" fill="#D9622B">POST /api/rfid/checkin</text>
      
      <rect y="36" width="224" height="28" rx="4" fill="#FBF5F0" stroke="#D9622B" stroke-width="1" />
      <text x="10" y="54" font-size="10" font-weight="700" fill="#D9622B">POST /api/rfid/register</text>

      <rect y="72" width="224" height="28" rx="4" fill="#FBF5F0" stroke="#D9622B" stroke-width="1" />
      <text x="10" y="90" font-size="10" font-weight="700" fill="#D9622B">GET /api/rfid/status/{uid}</text>

      <text x="4" y="125" font-size="10" fill="#1B1A17" opacity="0.7">• Sanitized Payload Validation</text>
      <text x="4" y="140" font-size="10" fill="#1B1A17" opacity="0.7">• Token Auth (Laravel Sanctum)</text>
    </g>
  </g>

  <!-- NODE 3: Business Logic & Rules Engine -->
  <g transform="translate(750, 140)" filter="url(#shadow)">
    <rect width="390" height="220" rx="12" fill="#FFFFFF" stroke="#3E7D2F" stroke-width="2" />
    <rect width="390" height="34" rx="12" fill="url(#meadowGrad)" />
    <rect x="0" y="24" width="390" height="10" fill="url(#meadowGrad)" />
    <circle cx="20" cy="17" r="4" fill="#F2D13B" />
    <text x="35" y="21" font-size="11" fill="#FFFFFF" font-weight="700" letter-spacing="1">03. RULE &amp; KPI VALIDATION ENGINE</text>
    
    <g transform="translate(20, 50)">
      <rect width="350" height="42" rx="6" fill="#F2F9F0" stroke="#3E7D2F" stroke-width="1" />
      <text x="12" y="20" font-size="11" font-weight="700" fill="#1F3D1A">Rule A: Schedule Verification</text>
      <text x="12" y="34" font-size="10" fill="#3E7D2F">Cutoff: 08:30 WIB → Flags 'Hadir' vs 'Terlambat'</text>

      <rect y="48" width="350" height="52" rx="6" fill="#FFF9E6" stroke="#F2D13B" stroke-width="1.5" />
      <text x="12" y="68" font-size="11" font-weight="800" fill="#B8860B">Rule B: 70% Daily Task Gate (Tap-Out)</text>
      <text x="12" y="84" font-size="10" fill="#1B1A17" opacity="0.8">Tap-out strictly forbidden unless task completion ≥ 70%</text>
      <text x="12" y="95" font-size="9" fill="#D9622B" font-weight="600">Incomplete tasks auto-roll to next workday (skips weekend)</text>

      <rect y="106" width="350" height="42" rx="6" fill="#FBF5F0" stroke="#D9622B" stroke-width="1" />
      <text x="12" y="126" font-size="11" font-weight="700" fill="#D9622B">Rule C: Monthly KPI Score Calculation</text>
      <text x="12" y="140" font-size="10" fill="#1B1A17" opacity="0.7">Weighted formulas: Attendance fidelity + Task resolution</text>
    </g>
  </g>

  <!-- NODE 4: Relational Database (MySQL 8) -->
  <g transform="translate(760, 430)" filter="url(#shadow)">
    <rect width="380" height="190" rx="12" fill="#FFFFFF" stroke="#1B1A17" stroke-width="1.5" />
    <rect width="380" height="34" rx="12" fill="#1B1A17" />
    <rect x="0" y="24" width="380" height="10" fill="#1B1A17" />
    <text x="20" y="21" font-size="11" fill="#F7F3EB" font-weight="700" letter-spacing="1">04. RELATIONAL DATABASE (MYSQL 8.0)</text>
    
    <g transform="translate(20, 50)" font-size="10" fill="#1B1A17">
      <text x="0" y="15" font-weight="700">• users &amp; employees</text>
      <text x="170" y="15" opacity="0.6">Roles: HRD, Staff</text>
      
      <text x="0" y="35" font-weight="700">• rfid_cards &amp; attendances</text>
      <text x="170" y="35" opacity="0.6">UID, tap_in, tap_out, status</text>

      <text x="0" y="55" font-weight="700">• task_assignments &amp; completions</text>
      <text x="170" y="55" opacity="0.6">Progress %, carry_over_date</text>

      <text x="0" y="75" font-weight="700">• kpi_scores &amp; thresholds</text>
      <text x="170" y="75" opacity="0.6">Customizable monthly metrics</text>
    </g>
  </g>

  <!-- NODE 5: Web Management Portal (Tailwind + Vite) -->
  <g transform="translate(60, 430)" filter="url(#shadow)">
    <rect width="260" height="190" rx="12" fill="#FFFFFF" stroke="#1B1A17" stroke-width="1.5" />
    <rect width="260" height="34" rx="12" fill="#1B1A17" />
    <rect x="0" y="24" width="260" height="10" fill="#1B1A17" />
    <text x="20" y="21" font-size="11" fill="#F7F3EB" font-weight="700" letter-spacing="1">05. EXECUTIVE MONITORING</text>
    
    <g transform="translate(18, 55)" font-size="11" fill="#1B1A17">
      <text x="0" y="14" font-weight="700">• HRD Management Desk</text>
      <text x="0" y="30" font-size="10" opacity="0.65">Assign tasks, adjust KPI thresholds</text>

      <text x="0" y="50" font-weight="700">• Staff Self-Service Portal</text>
      <text x="0" y="66" font-size="10" opacity="0.65">Submit progress &amp; daily logs</text>

      <text x="0" y="86" font-weight="700">• Maatwebsite Excel Export</text>
      <text x="0" y="102" font-size="10" opacity="0.65">Automated payroll &amp; KPI audits</text>
    </g>
  </g>
</svg>
