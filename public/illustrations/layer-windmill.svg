<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <linearGradient id="hillMidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#558C4A" />
      <stop offset="100%" stop-color="#3C6E33" />
    </linearGradient>
  </defs>

  <!-- Mid-hill ground wave -->
  <path d="M 0 600 L 0 340 Q 420 400 860 310 Q 1340 220 1920 330 L 1920 600 Z" fill="url(#hillMidGrad)" />

  <!-- Windmill Structure at x=340, y=140 -->
  <g transform="translate(340, 160)">
    <!-- Base tower -->
    <polygon points="40,240 55,90 95,90 110,240" fill="#754731" stroke="#3A2114" stroke-width="2" />
    <!-- Cap dome -->
    <path d="M 50 90 Q 75 55 100 90 Z" fill="#3A2114" />
    <!-- Balcony ring -->
    <rect x="35" y="145" width="80" height="8" rx="2" fill="#3A2114" />
    <line x1="38" y1="145" x2="38" y2="135" stroke="#3A2114" stroke-width="2" />
    <line x1="112" y1="145" x2="112" y2="135" stroke="#3A2114" stroke-width="2" />
    <line x1="35" y1="135" x2="115" y2="135" stroke="#3A2114" stroke-width="2" />
    <!-- Rotating sails container with CSS rotation class -->
    <g class="animate-spin-slow origin-[75px_85px]">
      <circle cx="75" cy="85" r="7" fill="#3A2114" />
      <!-- 4 Lattice blades -->
      <!-- Top blade -->
      <line x1="75" y1="85" x2="75" y2="-35" stroke="#D9D0C1" stroke-width="4" />
      <rect x="76" y="-30" width="22" height="100" fill="none" stroke="#D9D0C1" stroke-width="1.5" />
      <!-- Bottom blade -->
      <line x1="75" y1="85" x2="75" y2="205" stroke="#D9D0C1" stroke-width="4" />
      <rect x="52" y="105" width="22" height="100" fill="none" stroke="#D9D0C1" stroke-width="1.5" />
      <!-- Left blade -->
      <line x1="75" y1="85" x2="-45" y2="85" stroke="#D9D0C1" stroke-width="4" />
      <rect x="-40" y="63" width="100" height="22" fill="none" stroke="#D9D0C1" stroke-width="1.5" />
      <!-- Right blade -->
      <line x1="75" y1="85" x2="195" y2="85" stroke="#D9D0C1" stroke-width="4" />
      <rect x="95" y="85" width="100" height="22" fill="none" stroke="#D9D0C1" stroke-width="1.5" />
    </g>
  </g>

  <!-- Village houses with terracotta roofs -->
  <g transform="translate(480, 310)">
    <!-- House 1 -->
    <rect x="0" y="30" width="70" height="45" fill="#E8E0D2" stroke="#1B1A17" stroke-width="1.5" />
    <polygon points="-8,30 35,0 78,30" fill="#D9622B" stroke="#1B1A17" stroke-width="1.5" />
    <rect x="25" y="48" width="16" height="27" fill="#3A2114" />
    <!-- House 2 -->
    <rect x="85" y="20" width="90" height="55" fill="#C93B2B" stroke="#1B1A17" stroke-width="1.5" />
    <polygon points="78,20 130,-10 182,20" fill="#D9622B" stroke="#1B1A17" stroke-width="1.5" />
    <rect x="100" y="35" width="18" height="18" fill="#F3EBDD" stroke="#1B1A17" stroke-width="1" />
    <rect x="145" y="35" width="18" height="18" fill="#F3EBDD" stroke="#1B1A17" stroke-width="1" />
  </g>

  <!-- Right village houses -->
  <g transform="translate(1320, 240)">
    <rect x="0" y="25" width="80" height="50" fill="#C93B2B" stroke="#1B1A17" stroke-width="1.5" />
    <polygon points="-6,25 40,-5 86,25" fill="#D9622B" stroke="#1B1A17" stroke-width="1.5" />
    <rect x="95" y="35" width="60" height="40" fill="#E8E0D2" stroke="#1B1A17" stroke-width="1.5" />
    <polygon points="90,35 125,12 160,35" fill="#D9622B" stroke="#1B1A17" stroke-width="1.5" />
  </g>
</svg>
